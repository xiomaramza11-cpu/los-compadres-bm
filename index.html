<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#10130d,#24180d 55%,#0e120b);
    color:#fff;
    display:flex;
    justify-content:center;
    padding:28px 16px;
  }
  .page{
    width:100%;
    max-width:430px;
    text-align:center;
  }
  .logo{
    width:150px;height:150px;
    margin:0 auto 14px;
    border-radius:50%;
    display:block;
    object-fit:cover;
    box-shadow:0 0 25px rgba(213,168,59,.18);
  }
  h1{
    margin:4px 0 2px;
    font-size:30px;
    letter-spacing:1px;
  }
  .subtitle{
    color:#d5a83b;
    font-weight:700;
    font-size:17px;
    margin-bottom:8px;
  }
  .tagline{
    color:#ddd;
    font-size:14px;
    margin:0 0 24px;
  }
  .button{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:15px 18px;
    margin:12px 0;
    border-radius:16px;
    text-decoration:none;
    color:white;
    font-weight:800;
    font-size:16px;
    box-shadow:0 6px 16px rgba(0,0,0,.28);
    transition:transform .15s;
  }
  .button:active{transform:scale(.98)}
  .icon{
    width:40px;height:40px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,.18);
    font-size:22px;
    flex:none;
  }
  .tiktok{background:#111}
  .facebook{background:#1877f2}
  .instagram{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)}
  .whatsapp{background:#20b95c}
  .maps{background:#b3261e}
  .arrow{margin-left:auto;font-size:25px}
  .footer{
    margin-top:24px;
    color:#aaa;
    font-size:13px;
  }
</style>
